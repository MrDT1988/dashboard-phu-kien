<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Báo cáo ngày — Vùng Tiền Giang</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#111827; --mut:#6b7280; --line:#e5e7eb;
  --acc:#046a38; --acc2:#0a8f4d; --warn:#b45309; --bad:#b91c1c; --ok:#046a38;
  --chip:#eef2f5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --card:#171e24; --ink:#e8edf2; --mut:#9aa7b2; --line:#26313a;
  --acc:#2ea96a; --acc2:#39c47c; --warn:#f0b357; --bad:#f2837c; --ok:#39c47c; --chip:#1e272e;
}}
:root[data-theme="dark"]{
  --bg:#0f1418; --card:#171e24; --ink:#e8edf2; --mut:#9aa7b2; --line:#26313a;
  --acc:#2ea96a; --acc2:#39c47c; --warn:#f0b357; --bad:#f2837c; --ok:#39c47c; --chip:#1e272e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;margin:0 0 16px}
header .w{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header .sub{font-size:12px;opacity:.85;margin-top:2px;font-weight:400}
.tabs{display:flex;gap:6px;margin:0 0 16px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mut);font:600 13px/1 inherit;
  padding:10px 4px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.hint{font-size:12px;color:var(--mut);font-weight:400}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:16px/1.3 inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:1px}
.row{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;font:600 14px/1 inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.seg button.off[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a1200}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;
  font:700 16px/1 inherit;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
pre.rep{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;
  font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.y{background:var(--ok)}.dot.n{background:var(--line);border:1px solid var(--mut)}
.dot.o{background:var(--warn)}
.msg{padding:12px;border-radius:10px;font-size:14px;margin-bottom:14px;font-weight:600}
.msg.ok{background:rgba(4,106,56,.12);color:var(--ok);border:1px solid rgba(4,106,56,.3)}
.msg.er{background:rgba(185,28,28,.1);color:var(--bad);border:1px solid rgba(185,28,28,.3)}
.msg.wn{background:rgba(180,83,9,.12);color:var(--warn);border:1px solid rgba(180,83,9,.3)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.2}
.kpi span{font-size:11px;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center;padding:8px 0 24px}
.lnk{color:var(--acc2);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.hide{display:none!important}
@media(max-width:400px){.grid2{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="w"><div style="flex:1">
  <h1 id="hTitle">Báo cáo ngày</h1>
  <div class="sub" id="hSub">Vùng Tiền Giang</div>
</div><button class="lnk" style="color:#fff" onclick="moCaiDat()">⚙︎</button></div></header>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="pg">PG</button>
    <button role="tab" data-v="sale">Sale</button>
    <button role="tab" data-v="leader">Leader / Vùng</button>
  </div>

  <div id="msg"></div>

  <!-- ================= PG ================= -->
  <section id="vPG" class="hide">
    <div class="card">
      <h2>Người báo</h2>
      <div class="row">
        <label>Tên PG</label>
        <select id="pgTen"></select>
      </div>
      <div class="row" id="pgStoreWrap">
        <label>Shop</label>
        <select id="pgStore"></select>
      </div>
      <div class="row"><label>Ngày báo cáo</label><input type="date" id="pgNgay"></div>
      <div class="row">
        <label>Ca làm hôm nay</label>
        <div class="seg">
          <button type="button" id="caOn" onclick="setCa('On')">Đi làm</button>
          <button type="button" class="off" id="caOff" onclick="setCa('Off')">Nghỉ</button>
        </div>
      </div>
    </div>

    <div class="card" id="pgSo">
      <h2>Số ngày</h2>
      <div class="grid2">
        <div class="row"><label>D.Thu ngày <span class="hint">(triệu)</span></label>
          <input type="number" inputmode="decimal" id="pgDThu" min="0" step="0.1" placeholder="0"></div>
        <div class="row"><label>S.O ngày <span class="hint">(máy)</span></label>
          <input type="number" inputmode="numeric" id="pgSO" min="0" step="1" placeholder="0"></div>
      </div>
      <div class="grid2">
        <div class="row"><label>Trong đó Reno16 sr</label>
          <input type="number" inputmode="numeric" id="pgR16" min="0" step="1" placeholder="0"></div>
        <div class="row"><label>Trong đó Find X9</label>
          <input type="number" inputmode="numeric" id="pgFX" min="0" step="1" placeholder="0"></div>
      </div>
      <div class="row"><label>Ghi chú <span class="hint">(không bắt buộc)</span></label>
        <textarea id="pgGC" rows="2" placeholder="Shop hết hàng màu Tím, khách hẹn mai lấy…"></textarea></div>
    </div>

    <button class="btn" id="pgGui" onclick="guiPG()">Gửi cho Sale</button>
    <div class="foot" id="pgFoot"></div>
  </section>

  <!-- ================= SALE ================= -->
  <section id="vSale" class="hide">
    <div class="card">
      <h2>Sale báo cáo</h2>
      <div class="row"><label>Tên Sale</label><select id="sTen"></select></div>
      <div class="row"><label>Ngày báo cáo</label><input type="date" id="sNgay"></div>
      <button class="btn sec" onclick="tai()">↻ Lấy số PG đã báo</button>
    </div>

    <div class="card" id="sCardPG">
      <h2>PG đã báo <span class="hint" id="sDem"></span></h2>
      <table id="sBang"><tbody></tbody></table>
    </div>

    <div class="card hide" id="sNoPG">
      <h2>Số ngày <span class="hint">(shop không có PG — Sale tự nhập)</span></h2>
      <div class="grid2">
        <div class="row"><label>D.Thu ngày <span class="hint">(triệu)</span></label>
          <input type="number" inputmode="decimal" id="sDThu" min="0" step="0.1" placeholder="0"></div>
        <div class="row"><label>S.O ngày <span class="hint">(máy)</span></label>
          <input type="number" inputmode="numeric" id="sSO" min="0" step="1" placeholder="0"></div>
      </div>
      <div class="grid2">
        <div class="row"><label>S.O VIP ngày</label>
          <input type="number" inputmode="numeric" id="sSOVIP" min="0" step="1" placeholder="0"></div>
        <div class="row"><label>R16 ngày</label>
          <input type="number" inputmode="numeric" id="sR16" min="0" step="1" placeholder="0"></div>
      </div>
    </div>

    <div class="card">
      <h2>Số Sale tự nhập</h2>
      <div class="grid2">
        <div class="row"><label>Check shop tuần <span class="hint">(shop)</span></label>
          <input type="number" inputmode="numeric" id="sCheck" min="0" step="1" placeholder="0"></div>
        <div class="row"><label>D.Thu IOT ngày <span class="hint">(triệu)</span></label>
          <input type="number" inputmode="decimal" id="sIOT" min="0" step="0.1" placeholder="0"></div>
      </div>
      <div id="sIND" class="hide">
        <div class="grid2">
          <div class="row"><label>S.I ngày <span class="hint">(máy)</span></label>
            <input type="number" inputmode="numeric" id="sSI" min="0" step="1" placeholder="0"></div>
          <div class="row"><label>S.I PK ngày <span class="hint">(triệu)</span></label>
            <input type="number" inputmode="decimal" id="sSIPK" min="0" step="0.1" placeholder="0"></div>
        </div>
        <div class="grid2">
          <div class="row"><label>S.I Reno ngày</label>
            <input type="number" inputmode="numeric" id="sSIReno" min="0" step="1" placeholder="0"></div>
          <div class="row"><label>S.I OPPO ngày</label>
            <input type="number" inputmode="numeric" id="sSIOPPO" min="0" step="1" placeholder="0"></div>
        </div>
      </div>
      <div class="row"><label>Ghi chú gửi Leader</label>
        <textarea id="sGC" rows="2" placeholder="Lý do hụt / việc cần hỗ trợ…"></textarea></div>
    </div>

    <button class="btn" onclick="guiSale()">Gửi Leader &amp; Vùng</button>

    <div class="card" id="sRepWrap" style="margin-top:14px">
      <h2>Báo cáo gửi đi</h2>
      <pre class="rep" id="sRep">Bấm “Lấy số PG đã báo” để xem trước.</pre>
      <button class="btn sec" onclick="chep('sRep')">📋 Copy để dán Zalo</button>
    </div>
  </section>

  <!-- ================= LEADER ================= -->
  <section id="vLead" class="hide">
    <div class="card">
      <div class="row"><label>Ngày báo cáo</label><input type="date" id="lNgay"></div>
      <button class="btn sec" onclick="taiVung()">↻ Cập nhật</button>
    </div>
    <div class="kpi" id="lKpi"></div>
    <div class="card">
      <h2>Báo cáo vùng</h2>
      <pre class="rep" id="lRep">Bấm “Cập nhật”.</pre>
      <button class="btn sec" onclick="chep('lRep')">📋 Copy để dán Zalo</button>
    </div>
    <div class="card">
      <h2>Ai đã báo</h2>
      <table id="lBang"><tbody></tbody></table>
    </div>
  </section>

  <div class="foot">Vùng Tiền Giang · PG → Sale → Leader · <button class="lnk" onclick="moCaiDat()">Cài đặt link</button></div>
</div>

function moCaiDat(){
  var u = prompt('Dán link Ứng dụng web của Apps Script (kết thúc bằng /exec).\nĐể trống = chạy thử ngoại tuyến.', API);
  if(u===null) return;
  API = u.trim(); localStorage.setItem('bc_api',API);
  bao(API? 'Đã lưu link. Tải lại trang…':'Đã chuyển sang chế độ chạy thử.','ok');
  setTimeout(function(){location.reload()},700);
}

/* ===== GỌI API ===== */
function get(params){
  if(!API) return Promise.reject('offline');
  var u = API + (API.indexOf('?')>-1?'&':'?') + params;
  return fetch(u).then(function(r){return r.json()}).then(function(j){
    if(!j.ok) throw (j.err||'Lỗi'); return j;
  });
}
function post(body){
  if(!API) return Promise.reject('offline');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok) throw (j.err||'Lỗi'); return j;
  });
}

function doiVai(v){
  VAI=v;
  ['pg','sale','leader'].forEach(function(x,i){
    tabs.children[i].setAttribute('aria-selected', x===v);
  });
  $('vPG').classList.toggle('hide', v!=='pg');
  $('vSale').classList.toggle('hide', v!=='sale');
  $('vLead').classList.toggle('hide', v!=='leader');
  $('hTitle').textContent = v==='pg'?'PG báo cáo ngày': v==='sale'?'Sale báo cáo ngày':'Báo cáo vùng';
  history.replaceState(null,'','?v='+v);
  bao('');
  if(v==='leader') taiVung();
}

      .map(function(t){return '<option>'+t+'</option>'}).join('');
  sel.onchange = napShop;
  var s=$('sTen');

    DATA.sale.map(function(r){return '<option value="'+r.Sale+'">'+r.Sale+' ('+r.Kenh+')</option>'}).join('');

  var nho=localStorage.getItem('bc_pg'); if(nho){sel.value=nho;napShop()}

}
function napShop(){

function guiPG(){
  var ten=$('pgTen').value, store=$('pgStore').value;
  if(!ten) return bao('Chưa chọn tên PG.','er');
  if(CA==='On'){
    var so=num('pgSO'), r16=num('pgR16'), fx=num('pgFX');
    if(r16+fx>so) return bao('Reno16 + Find X9 ('+(r16+fx)+') đang lớn hơn S.O ngày ('+so+'). Kiểm tra lại.','er');
    if(so>0 && num('pgDThu')<=0) return bao('Có S.O nhưng D.Thu đang bằng 0. Kiểm tra lại.','er');
  }
  var body={loai:'pg',ngay:$('pgNgay').value,tenPG:ten,storeID:store,ca:CA,
    dthu:num('pgDThu'),so:num('pgSO'),r16:num('pgR16'),findx:num('pgFX'),ghichu:$('pgGC').value};
  $('pgGui').disabled=true;
  post(body).then(function(j){
    bao((j.ghiDe?'Đã cập nhật lại báo cáo. ':'Đã gửi. ')+'Sale <b>'+(j.sale||'')+'</b> nhận được rồi.','ok');
    $('pgGui').disabled=false;
  }).catch(function(e){
    $('pgGui').disabled=false;
    if(e==='offline'){ bao('Chưa gắn link Apps Script — đang chạy thử. Số đã ghi nhận tạm trên máy.','wn');
      luuTam(body); } else bao('Không gửi được: '+e,'er');
  });
}
function luuTam(b){
  var k='bc_tam', a=JSON.parse(localStorage.getItem(k)||'[]');
  a=a.filter(function(x){return !(x.ngay===b.ngay&&x.tenPG===b.tenPG&&x.storeID===b.storeID)});
  a.push(b); localStorage.setItem(k,JSON.stringify(a));
}
function docTam(ngay,sale){
  var a=JSON.parse(localStorage.getItem('bc_tam')||'[]');
  var idx={}; DATA.pg.forEach(function(r){ idx[r.TenPG+'|'+r.StoreID]=r });
  return a.filter(function(x){
    var r=idx[x.tenPG+'|'+x.storeID];
    return x.ngay===ngay && r && r.Sale===sale;
  });
}

function veBangSaleTam(sale,ngay){
  var ds=DATA.pg.filter(function(r){return r.Sale===sale});

    tong:{chuaBao:ds.length-tam.length}};

function repSaleTam(sale,ngay,d){
  var s=DATA.sale.filter(function(x){return x.Sale===sale})[0]||{};

    'SL PG\t:\t'+on+'\t/\t'+d.pg.length+'\t/\t'+pct(on,d.pg.length),
    'PGs OFF ngày\t:\t'+off+'\t/\t'+d.pg.length+'\t/\t'+pct(off,d.pg.length),'-----------------------',
    'D.Thu ngày ( M )\t:\t'+fmt(g('dthu'))+'\t/\t'+(s.TgDThuNgay||0)+'\t/\t'+pct(g('dthu'),s.TgDThuNgay),
    'S.O Ngày\t:\t'+g('so')+'\t/\t'+(s.TgSONgay||0)+'\t/\t'+pct(g('so'),s.TgSONgay),'-----------------------',

function veBangVung(ts){
  var tb=$('lBang').querySelector('tbody');
  tb.innerHTML='<tr><th>Sale</th><th>PG báo</th><th>D.Thu</th><th>S.O</th><th>R16</th></tr>'+
    ts.map(function(r){
      var cls=r.saleDaBao?'y':(r.pgDaBao?'o':'n');
      return '<tr><td><span class="dot '+cls+'"></span>'+r.sale+'<div class="hint">'+r.kenh+
        (r.leader?' · '+r.leader:'')+'</div></td><td>'+r.pgDaBao+'/'+r.soPG+'</td><td>'+fmt(r.dthu)+
        '</td><td>'+r.so+'</td><td>'+r.r16+'</td></tr>';
    }).join('');
  var t=ts.reduce(function(a,r){a.so+=r.so;a.r16+=r.r16;a.sale+=r.saleDaBao;return a},{so:0,r16:0,sale:0});
  $('lKpi').innerHTML='<div><b>'+t.r16+'</b><span>R16 ngày</span></div>'+
    '<div><b>'+t.so+'</b><span>S.O ngày</span></div>'+
    '<div><b>'+t.sale+'/'+ts.length+'</b><span>Sale đã báo</span></div>';
}

/* ===== COPY ===== */
function chep(id){
  var t=$(id).textContent;
  var done=function(){bao('Đã copy. Mở Zalo và dán vào nhóm.','ok')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,thuCong)}
  else thuCong();
  function thuCong(){
    var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy');done()}catch(e){bao('Máy không cho copy tự động — giữ và chọn thủ công.','wn')}
    document.body.removeChild(a);
  }
}
