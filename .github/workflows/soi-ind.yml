# Soi con so "shop chua ban thang nay" o kenh IND.
# KHONG mo DB TG, khong dung Apps Script — chi doc goi du lieu da co trong repo.
# Ket qua data/soi-ind.json CHI CO TI LE (%) va so ngay, khong co so may /
# doanh thu tuyet doi nao (repo la public).
name: Soi so lieu IND

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  soi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai jsdom
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund jsdom@24
      - name: Soi
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/soi-ind.mjs
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/soi-ind.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Ket qua soi so lieu IND"
          for i in 1 2 3 4 5; do
            if git push; then echo "Da luu ket qua."; exit 0; fi
            echo "Push bi tu choi (lan $i) - keo ve roi thu lai..."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "::warning::Khong push duoc ket qua sau 5 lan."
