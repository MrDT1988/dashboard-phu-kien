# Tu dong lam moi so lieu cho App Sale/ASM.
# Chay tren may chu cua GitHub - KHONG can may cua anh Thai bat.
name: Cap nhat so lieu App

on:
  schedule:
    # 03:00 UTC = 10:00 sang gio Viet Nam. Chay moi ngay.
    - cron: '0 3 * * *'
  workflow_dispatch:        # cho phep bam chay tay tren GitHub
    inputs:
      force:
        description: 'Ghi de ngay ca khi so lieu tut lui (1 = co)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # DB TG cham dan; 45 phut da tung khong du. Cho 1 lan thu keo dai 40 phut.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai trinh duyet an
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Lay so lieu moi tu DB TG
        env:
          SITE_URL: https://mrdt1988.github.io/dashboard-phu-kien
          FORCE: ${{ github.event.inputs.force }}
          SALE_CODES: ${{ secrets.SALE_CODES }}
          AS_KEY: ${{ secrets.AS_KEY }}
          GT_CSV: ${{ secrets.GT_CSV }}
        run: node scripts/refresh-app-data.mjs

      # Chia thanh cac goi MA HOA rieng tung nguoi. app-data.json (ban goc, chua ma hoa)
      # CHI ton tai trong lan chay nay, KHONG BAO GIO duoc luu vao repo.
      - name: Ma hoa theo tung nguoi
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
          AS_KEY: ${{ secrets.AS_KEY }}
        run: node scripts/build-vault.mjs

      - name: Soi goi that cua tung nguoi (chong ro ri)
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/kiem-goi-that.mjs

      # Bo kiem hong thi so lieu KHONG duoc luu (dung y muon — khong day goi ro ri
      # len repo). Nhung ket qua kiem thi VAN phai luu, neu khong khong ai biet
      # vi sao hong: log Action doc khong duoc tu may anh Thai.
      - name: Luu ket qua soi goi (du hong hay khong)
        if: always()
        run: |
          if [ ! -f data/ket-qua-kiem-goi.json ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ket-qua-kiem-goi.json
          git diff --cached --quiet && exit 0
          git commit -m "Ket qua soi goi that"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep 4
          done

      - name: Luu lai neu co thay doi
        run: |
          rm -f app-data.json          # tuyet doi khong day ban chua ma hoa len
          # DUNG "git diff": no CHI thay file da duoc theo doi. Goi DB TG moi
          # (data/dbtg-<id>.json) la file MOI TINH nen git diff khong thay ->
          # workflow tuong "khong co gi doi" roi bo qua. Phai dung git status.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "So lieu khong doi - khong can luu."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git commit -m "Tu dong cap nhat so lieu app ($(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M'))"
          # Bo ra soat DB TG cung ghi ket qua vao data/ nen hai ben hay dam nhau.
          # Truoc day day thang, bi tu choi la ca lan chay coi nhu vut di.
          for i in 1 2 3 4 5; do
            if git push; then echo "Da luu so lieu moi."; exit 0; fi
            echo "Push bi tu choi (lan $i) - keo ve roi thu lai..."
            git pull --rebase --autostash origin main || {
              echo "::error::Keo ve that bai - dung lai de khong lam hong lich su."; exit 1; }
            sleep 5
          done
          echo "::error::Khong push duoc sau 5 lan."
          exit 1

      - name: Bao loi ro rang
        if: failure()
        run: |
          echo "::error::Khong cap nhat duoc so lieu. App van dung ban cu, khong bi mat so."
          echo "Kiem tra: DB TG co mo duoc khong, Apps Script con song khong."
