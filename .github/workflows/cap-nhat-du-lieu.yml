# Tu dong lam moi so lieu cho DB TG + App Sale/ASM.
# Chay tren may chu cua GitHub - KHONG can may cua anh Thai bat.
#
# SUA 02/09: truoc day chi chay 1 lan/ngay luc 10h sang. Anh Thai cap nhat so
# hoi 22h toi 01/09 -> goi du lieu van la ban 10h sang 01/09 (chot o ngay 23),
# va DB TG khong he bao la so cu. Gio chay day trong khung gio co so, cong them
# mot luot toi de don so nhap buoi toi.
#
# Chay day ma van re: buoc "Do nguon" hoi Apps Script dung MOT cau (sheet co
# bao nhieu dong). Bang voi lan truoc -> thoat trong ~1 phut, khong mo Playwright.
name: Cap nhat so lieu App

on:
  schedule:
    # Gio UTC. Viet Nam = UTC+7.
    # SUA 02/09 (lan 2): khung cu dung o 13:40 trua. Anh Thai sua so luc 16h thi App Sale
    # dung yen toi 22h moi nhay - sale cam so cu di trien khai ca buoi chieu.
    # Nay quet 08:00-22:30 gio VN, moi 30 phut. Van re: buoc "Do nguon" chi hoi so dong,
    # bang lan truoc thi thoat trong ~1 phut, khong mo Playwright.
    - cron: '*/30 1-15 * * *'  # 08:00-22:30 gio VN, moi 30 phut
  workflow_dispatch:        # cho phep bam chay tay tren GitHub
    inputs:
      force:
        description: 'Ghi de ngay ca khi so lieu tut lui (1 = co)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # DB TG cham dan; 45 phut da tung khong du. Cho 1 lan thu keo dai 40 phut.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- BUOC RE: co gi moi khong? ----------------------------------------
      # Dat TRUOC buoc cai Playwright (buoc do mot minh da vai phut).
      # Nghi ngo la cho chay tiep - tha chay thua con hon bo sot mot ngay so.
      - name: Do nguon (re, ~1 phut)
        id: do
        env:
          AS_KEY: ${{ secrets.AS_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          # Bam tay (nut "Lam moi ngay" tren DB TG, hoac Run workflow) thi chay
          # thang, khong do. Chi lich tu dong moi phai qua buoc do.
          SU_KIEN: ${{ github.event_name }}
        run: node scripts/do-nguon.mjs

      - name: Cai trinh duyet an
        if: steps.do.outputs.co_moi == '1'
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Lay so lieu moi tu DB TG
        if: steps.do.outputs.co_moi == '1'
        env:
          SITE_URL: https://mrdt1988.github.io/dashboard-phu-kien
          FORCE: ${{ github.event.inputs.force }}
          SALE_CODES: ${{ secrets.SALE_CODES }}
          AS_KEY: ${{ secrets.AS_KEY }}
          GT_CSV: ${{ secrets.GT_CSV }}
        run: node scripts/refresh-app-data.mjs

      # Chia thanh cac goi MA HOA rieng tung nguoi. app-data.json (ban goc, chua ma hoa)
      # CHI ton tai trong lan chay nay, KHONG BAO GIO duoc luu vao repo.
      - name: Ma hoa theo tung nguoi
        if: steps.do.outputs.co_moi == '1'
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
          AS_KEY: ${{ secrets.AS_KEY }}
        run: node scripts/build-vault.mjs

      - name: Soi goi that cua tung nguoi (chong ro ri)
        if: steps.do.outputs.co_moi == '1'
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/kiem-goi-that.mjs

      # Bo kiem hong thi so lieu KHONG duoc luu (dung y muon — khong day goi ro ri
      # len repo). Nhung ket qua kiem thi VAN phai luu, neu khong khong ai biet
      # vi sao hong: log Action doc khong duoc tu may anh Thai.
      - name: Luu ket qua soi goi (du hong hay khong)
        if: always() && steps.do.outputs.co_moi == '1'
        run: |
          if [ ! -f data/ket-qua-kiem-goi.json ]; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ket-qua-kiem-goi.json
          git diff --cached --quiet && exit 0
          git commit -m "Ket qua soi goi that"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep 4
          done

      - name: Luu lai neu co thay doi
        if: steps.do.outputs.co_moi == '1'
        run: |
          rm -f app-data.json          # tuyet doi khong day ban chua ma hoa len
          # Moc nguon CHI duoc ghi khi da dung goi xong. Ghi som thi mot lan
          # dung that bai se lam luot sau tuong "khong co gi moi" roi bo qua luon.
          if [ -f /tmp/moc-nguon-moi.json ]; then cp /tmp/moc-nguon-moi.json data/moc-nguon.json; fi
          # DUNG "git diff": no CHI thay file da duoc theo doi. Goi DB TG moi
          # (data/dbtg-<id>.json) la file MOI TINH nen git diff khong thay ->
          # workflow tuong "khong co gi doi" roi bo qua. Phai dung git status.
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "So lieu khong doi - khong can luu."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git commit -m "Tu dong cap nhat so lieu app ($(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M'))"
          # Bo ra soat DB TG cung ghi ket qua vao data/ nen hai ben hay dam nhau.
          # Truoc day day thang, bi tu choi la ca lan chay coi nhu vut di.
          for i in 1 2 3 4 5; do
            if git push; then echo "Da luu so lieu moi."; exit 0; fi
            echo "Push bi tu choi (lan $i) - keo ve roi thu lai..."
            git pull --rebase --autostash origin main || {
              echo "::error::Keo ve that bai - dung lai de khong lam hong lich su."; exit 1; }
            sleep 5
          done
          echo "::error::Khong push duoc sau 5 lan."
          exit 1

      - name: Bao loi ro rang
        if: failure()
        run: |
          echo "::error::Khong cap nhat duoc so lieu. App van dung ban cu, khong bi mat so."
          echo "Kiem tra: DB TG co mo duoc khong, Apps Script con song khong."

      # ==== them 04/09/2026 — ghi TRANG THAI ROBOT ra file nho de app.html hien bang vang.
      # 03-04/09 robot do 40+ lan lien tiep (goi thieu truong shop_sale_by_id) ma khong ai biet,
      # vi may Mac khong doc duoc log Action. Tu nay moi lan chay (ke ca khi bo qua vi khong co
      # so moi) deu ghi data/trang-thai-robot.json: loi=true/false + buoc hong + gio VN.
      # File chi co trang thai, KHONG co so lieu kinh doanh (repo public).
      - name: Ghi trang thai robot (luon chay)
        if: always()
        env:
          KET_QUA: ${{ job.status }}
          CO_MOI: ${{ steps.do.outputs.co_moi }}
        run: |
          mkdir -p data
          BUOC=""
          if [ "$KET_QUA" != "success" ]; then
            if [ ! -f /tmp/moc-nguon-moi.json ]; then BUOC="Lay so lieu moi tu DB TG (Apps Script/Playwright)"; fi
            if [ -f data/ket-qua-kiem-goi.json ] && grep -q '"khongDat": *[1-9]' data/ket-qua-kiem-goi.json 2>/dev/null; then BUOC="Soi goi that (kiem-goi-that)"; fi
            [ -z "$BUOC" ] && BUOC="khong ro - xem Actions"
          fi
          printf '{"loi":%s,"buoc":"%s","luc":"%s","coMoi":"%s","run":"%s"}\n' \
            "$([ "$KET_QUA" = success ] && echo false || echo true)" "$BUOC" \
            "$(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M')" "${CO_MOI:-?}" "${{ github.run_number }}" > data/trang-thai-robot.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/trang-thai-robot.json
          git diff --cached --quiet && exit 0
          git commit -m "Trang thai robot #${{ github.run_number }}: $KET_QUA" >/dev/null
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || exit 0
            sleep 4
          done
          exit 0
      # ==== het khoi them 04/09/2026 ====
