# Boc phan CAU TRUC tu ket qua do tham share KA — chay khi bam tay.
# KHONG mo DB TG, khong dung Apps Script: chi doc file da co san trong repo.
# Ket qua data/probe-ka-cautruc.json chi co ten bang / ten cot / so dong,
# TUYET DOI khong co so lieu kinh doanh (repo la public).
name: Boc cau truc share KA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Boc cau truc
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/boc-ka.mjs
      - name: Luu ket qua
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/probe-ka-cautruc.json
          git diff --cached --quiet || git commit -m "Cau truc sheet share KA (khong co so lieu)"
          git push
