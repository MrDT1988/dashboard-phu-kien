# Do tham du lieu IND — chi chay khi bam tay.
# Ket qua ghi ra data/probe-ind.json, DA MA HOA bang ma quan ly vung.
name: Do tham IND (ton kho)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai trinh duyet an
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Do tham
        env:
          SITE_URL: https://mrdt1988.github.io/dashboard-phu-kien
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/probe-ind.mjs
      - name: Luu ket qua
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/probe-ind.json
          git diff --cached --quiet || git commit -m "Ket qua do tham IND (da ma hoa)"
          git push
