# Do tham du lieu IND — chi chay khi bam tay, KHONG ghi gi vao repo.
name: Do tham IND (ton kho)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai trinh duyet an
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Do tham
        env:
          SITE_URL: https://mrdt1988.github.io/dashboard-phu-kien
        run: node scripts/probe-ind.mjs
