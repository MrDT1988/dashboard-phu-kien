# Ra soat app.html bang DU LIEU THAT (124 shop MWG / 29 KA / 204 IND).
# KHONG mo DB TG, khong dung Apps Script — chi doc goi du lieu da co trong repo.
# Ket qua data/ket-qua-kiem-app.json chi co ten phep kiem + dat/khong dat,
# khong co ten shop va khong co doanh thu (repo la public).
name: Ra soat app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai jsdom
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund jsdom@24
      - name: Ra soat
        env:
          SALE_CODES: ${{ secrets.SALE_CODES }}
        run: node scripts/kiem-app.mjs
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ket-qua-kiem-app.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Ket qua ra soat app bang du lieu that"
          # Anh Thai van day commit tay trong luc bai kiem chay -> push bi tu choi.
          # Truoc day nuot loi bang "|| true", ket qua cu nam lai lam nguoi doc tuong
          # bai kiem chua chay. Gio keo ve roi thu lai.
          for i in 1 2 3 4 5; do
            if git push; then echo "Da luu ket qua ra soat."; exit 0; fi
            echo "Push bi tu choi (lan $i) - keo ve roi thu lai..."
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "::warning::Khong push duoc ket qua ra soat sau 5 lan."
